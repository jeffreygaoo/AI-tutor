[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-tutor-engine"
version = "0.1.0"
description = "Deterministic graph, mastery, curriculum, and review engine for an AI Tutor"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Proprietary"}
dependencies = []

[project.scripts]
ai-tutor = "scripts.tutor_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tutor_engine*", "scripts*"]

[tool.setuptools.package-data]
"tutor_engine.dashboard" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.setuptools.data-files]
"share/ai-tutor/skill/ai-tutor" = ["skill/ai-tutor/SKILL.md"]
"share/ai-tutor/skill/ai-tutor/references" = [
  "skill/ai-tutor/references/blueprint-rules.md",
  "skill/ai-tutor/references/graph-rules.md",
  "skill/ai-tutor/references/mastery-rules.md",
  "skill/ai-tutor/references/pedagogy.md",
  "skill/ai-tutor/references/quiz-rules.md",
]
